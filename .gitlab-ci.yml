image: gradle:7.6-jdk17

stages:
  - test
  - build
  - dockerize

test_job:
  stage: test
  services:
    - name: postgres:14-alpine
      alias: postgres
  variables:
    POSTGRES_DB: hr_test_db
    POSTGRES_USER: hr_user
    POSTGRES_PASSWORD: hr_password
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hr_test_db
    SPRING_DATASOURCE_USERNAME: hr_user
    SPRING_DATASOURCE_PASSWORD: hr_password
  before_script:
    - chmod +x ./gradlew
  script:
    - ./gradlew test

build_job:
  stage: build
  before_script:
    - chmod +x ./gradlew
  script:
    - ./gradlew build -x test
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 day

dockerize_job:
  stage: dockerize
  image: docker:24.0
  services:
    - docker:24.0-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs:
    - build_job
  script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    - docker build -t "$DOCKER_USERNAME/hr-service:$CI_COMMIT_SHORT_SHA" -t "$DOCKER_USERNAME/hr-service:latest" .
    - docker push "$DOCKER_USERNAME/hr-service:$CI_COMMIT_SHORT_SHA"
    - docker push "$DOCKER_USERNAME/hr-service:latest"
